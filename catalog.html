<!-- catalog.html -->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ServiceKz — Каталог</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --g1: #076653; --g2:#E2FBCE; --g3:#E3EF26; --muted:#6b6f72; --card:#fff; --radius:12px; --shadow:0 10px 30px rgba(6,30,20,0.06)
    }
    *{box-sizing:border-box}
    body{font-family:Inter,system-ui; margin:0;background:linear-gradient(180deg,#f6fbf9 0%, #f4f9f4 100%);color:#062a22}
    header{padding:16px 28px;display:flex;gap:12px;align-items:center;border-bottom:1px solid rgba(6,30,20,0.04);background:rgba(255,255,255,0.6);position:sticky;top:0;z-index:50}
    .container{max-width:1200px;margin:20px auto;padding:0 18px}
    .layout{display:grid;grid-template-columns:300px 1fr;gap:18px}
    .filters{background:var(--card);padding:14px;border-radius:12px;box-shadow:var(--shadow)}
    .list{display:flex;flex-direction:column;gap:12px}
    .service-card{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--card);border-radius:12px;box-shadow:var(--shadow)}
    .service-card img{width:120px;height:80px;object-fit:cover;border-radius:10px}
    .tag{padding:6px 8px;border-radius:8px;background:linear-gradient(90deg,var(--g1),var(--g2));color:#04331f;font-weight:700}
    .mini-map{height:220px;border-radius:12px;background:linear-gradient(180deg,#f8fff6,#fff);padding:12px}
    .filter-row{display:flex;gap:8px;margin-top:10px}
    .filter-row select,.filter-row input{padding:8px;border-radius:8px;border:1px solid #e6efe7}
    .levels{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .level{padding:8px 10px;border-radius:8px;border:1px solid rgba(7,102,83,0.06);background:#fff;cursor:pointer}
    .level.active{background:linear-gradient(90deg,var(--g1),var(--g2));color:#04331f;font-weight:800}
    @media (max-width:980px){
      .layout{grid-template-columns:1fr}
      header{padding:10px}
    }
  </style>
</head>
<body>
  <header>
    <div style="font-weight:800">ServiceKz</div>
    <nav style="margin-left:18px">
      <a href="index1.html" style="margin-right:10px">Главная</a>
      <a href="catalog.html" style="font-weight:700">Каталог</a>
    </nav>
    <div style="margin-left:auto;display:flex;gap:8px">
      <button class="btn" onclick="openCreateRequest()">Создать заявку</button>
    </div>
  </header>

  <main class="container">
    <div class="layout">
      <aside class="filters">
        <div style="font-weight:800">Фильтры</div>
        <div class="filter-row">
          <select id="f-city"><option>Все города</option><option>Алматы</option><option>Нур-Султан</option><option>Шымкент</option></select>
          <select id="f-sort"><option>По рейтингу</option><option>По цене</option><option>По расстоянию</option></select>
        </div>
        <div style="margin-top:12px">
          <div style="font-weight:700">Цена</div>
          <div class="filter-row">
            <input id="f-min" placeholder="Мин" />
            <input id="f-max" placeholder="Макс" />
          </div>
        </div>
        <div style="margin-top:12px">
          <div style="font-weight:700">Опыт (лет)</div>
          <input type="range" min="0" max="30" value="3" id="f-exp" />
        </div>

        <div style="margin-top:12px">
          <div style="font-weight:700">Уровень верификации</div>
          <div class="levels" id="level-list">
            <div class="level" data-level="Starter">Starter</div>
            <div class="level" data-level="Verified">Verified</div>
            <div class="level" data-level="Pro">Pro</div>
            <div class="level" data-level="Elite">Elite</div>
          </div>
        </div>

        <div style="margin-top:12px">
          <div style="font-weight:700">Карта (заглушка)</div>
          <div class="mini-map">Мини-карта с кластеризацией мастеров (имитация)</div>
        </div>

      </aside>

      <section>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 style="margin:0">Услуги</h2>
          <div class="small" id="list-count">6 мастеров</div>
        </div>

        <div class="list" id="services-list" style="margin-top:12px">
          <!-- JS inject -->
        </div>
      </section>
    </div>
  </main>

  <!-- Simple modal reuse from index (embedded) -->
  <div id="modal-backdrop" style="display:none;position:fixed;inset:0;background:rgba(2,10,6,0.36);align-items:center;justify-content:center;padding:24px;z-index:120">
    <div style="width:720px;max-width:98%;background:#fff;padding:18px;border-radius:12px;box-shadow:0 20px 40px rgba(5,30,20,0.3)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3>Создать заявку</h3>
        <div style="display:flex;gap:8px">
          <button onclick="saveDraft()" style="background:#fff;border:1px solid #e6efe7;padding:8px 10px;border-radius:8px">Сохранить</button>
          <button onclick="submitRequest()" style="background:linear-gradient(90deg,#076653,#E2FBCE);border:none;padding:8px 10px;border-radius:8px;color:#04331f">Опубликовать</button>
        </div>
      </div>
      <p class="small">Форма (заглушка)</p>
      <div style="margin-top:12px;display:flex;gap:8px">
        <input placeholder="Заголовок" style="flex:1;padding:8px;border-radius:8px;border:1px solid #e6efe7">
        <input placeholder="Бюджет" style="width:160px;padding:8px;border-radius:8px;border:1px solid #e6efe7">
      </div>
    </div>
  </div>

  <script>
    // Simple page script with mock data (reuse master data)
    const masters = [
      {id:1,name:'Алексей',spec:'Сантехник',city:'Алматы',rating:4.9,level:'Pro',priceFrom:1500,exp:6},
      {id:2,name:'Жанна',spec:'Электрик',city:'Нур-Султан',rating:4.8,level:'Verified',priceFrom:1200,exp:4},
      {id:3,name:'Кайрат',spec:'Ремонт кондиционеров',city:'Шымкент',rating:4.7,level:'Elite',priceFrom:4500,exp:12},
      {id:4,name:'Мария',spec:'Клининг',city:'Алматы',rating:4.6,level:'Starter',priceFrom:800,exp:1},
      {id:5,name:'Бек',spec:'Мебель на заказ',city:'Костанай',rating:4.85,level:'Pro',priceFrom:6500,exp:8},
      {id:6,name:'Айнур',spec:'Плиточник',city:'Нур-Султан',rating:4.5,level:'Verified',priceFrom:2200,exp:5}
    ];
    const listWrap = document.getElementById('services-list');
    function renderList(filterLevel){
      listWrap.innerHTML = '';
      const filtered = masters.filter(m => !filterLevel || m.level===filterLevel);
      document.getElementById('list-count').innerText = filtered.length + ' мастеров';
      filtered.forEach(m=>{
        const node = document.createElement('div');
        node.className = 'service-card';
        node.innerHTML = `
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='160'><rect rx='12' width='100%' height='100%' fill='%23eaf7ee'/><text x='50%' y='50%' fill='%23076353' font-size='18' text-anchor='middle' alignment-baseline='middle'>${encodeURIComponent(m.spec)}</text></svg>" alt="${m.spec}">
          <div style="flex:1">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-weight:800">${m.name}</div>
                <div class="small" style="color:var(--muted)">${m.spec} • ${m.city}</div>
              </div>
              <div style="text-align:right">
                <div class="tag">${m.level}</div>
                <div style="font-weight:800;margin-top:6px">${m.priceFrom} ₸</div>
              </div>
            </div>
            <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
              <div style="color:#6a8c6f;font-weight:700">★ ${m.rating}</div>
              <div class="small">Опыт: ${m.exp} лет</div>
              <div style="margin-left:auto"><button onclick="openProfile(${m.id})" style="padding:8px 10px;border-radius:8px;border:1px solid rgba(7,102,83,0.06);background:#fff">Посмотреть</button></div>
            </div>
          </div>
        `;
        listWrap.appendChild(node);
      });
    }
    renderList();

    // Filter level click
    document.getElementById('level-list').addEventListener('click',(e)=>{
      const el = e.target.closest('.level');
      if(!el) return;
      document.querySelectorAll('.level').forEach(l=>l.classList.remove('active'));
      el.classList.add('active');
      const lvl = el.getAttribute('data-level');
      renderList(lvl);
    });

    function openProfile(id){
      // in real app: navigate to master_profile.html?id=...
      window.location.href = 'master_profile.html';
    }

    // modal functions placeholder (reuse index modal naming)
    function openCreateRequest(){ document.getElementById('modal-backdrop').style.display='flex' }
    function saveDraft(){ alert('Черновик сохранён (эмуляция)') }
    function submitRequest(){ alert('Заявка опубликована (эмуляция)'); document.getElementById('modal-backdrop').style.display='none' }
  </script>
</body>
</html>
